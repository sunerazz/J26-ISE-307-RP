# Render Blueprint: one web service runs the decision API (Components 1-4)
# and serves the web dashboard at the same URL. The phone app calls this URL too.
#
# One service fits the free plan: it uses about 270 MB of the 512 MB limit and
# wakes once, instead of four services waking one after another.
# The four-service layout is kept in deploy/render.four-services.yaml.

services:
  - type: web
    name: j26-ise-307-rp
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: OSRM_BASE_URL
        value: https://router.project-osrm.org
      # The dashboard is served from the same origin. "*" also lets other browsers call the API.
      - key: CORS_ORIGINS
        value: "*"
      # Optional: plain-language explanations with a language model. Leave empty to use the template.
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
